<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Change Password</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Poppins, Arial, sans-serif;
      }
      body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    overflow-y:auto;
    overflow-x:hidden;
    padding:40px 0;
}
      body:before,
      body:after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(20px);
        opacity: 0.35;
      }
      body:before {
        width: 320px;
        height: 320px;
        background: #7c3aed;
        top: -120px;
        right: -80px;
      }
      body:after {
        width: 260px;
        height: 260px;
        background: #60a5fa;
        left: -80px;
        bottom: -80px;
      }
      .card {
        width: min(520px, 92vw);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
      }
      .header {
        padding: 40px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        text-align: center;
        color: #fff;
      }
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #fff;
        margin: auto;
        border: 5px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #4f46e5;
        font-size: 42px;
      }
      .header h2 {
        margin: 18px 0 6px;
      }
      .header p {
        opacity: 0.9;
      }
      form {
        padding: 28px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 0 0 8px;
        color: #334155;
      }
      .field{
    position:relative;
    margin-bottom:18px;
}

.field input{
    width:100%;
    height:52px;
    padding:0 48px 0 44px;
    border:1px solid #dbe4f0;
    border-radius:14px;
    font-size:15px;
}
      .field input:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
      }
    .left{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#6366f1;
}

.eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
    cursor:pointer;
}
      .bar {
        height: 8px;
        background: #e5e7eb;
        border-radius: 99px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #4f46e5, #7c3aed);
        transition: 0.3s;
      }
      small {
        display: block;
        margin: 8px 0 16px;
        color: #64748b;
      }
      .tips {
        background: #eef2ff;
        border-left: 4px solid #6366f1;
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        color: #475569;
        margin-bottom: 22px;
      }
      .buttons {
        display: flex;
        gap: 12px;
      }
      .btn {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        font-weight: 700;
        text-decoration: none;
        text-align: center;
      }
      .primary {
        border: none;
        color: #fff;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
      }
      .secondary {
        border: 2px solid #6366f1;
        color: #6366f1;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="avatar"><i class="fa-solid fa-user-shield"></i></div>
        <h2>Change Password</h2>
        <p>Keep your account secure</p>
      </div>
      <form method="POST">
        {% csrf_token %} <label>Current Password</label>
        <div class="field">
          <i class="fa-solid fa-lock left"></i
          ><input id="c" type="password" name="current_password" /><i
            class="fa-solid fa-eye eye"
            onclick="tog('c', this)"
          ></i>
        </div>
        <label>New Password</label>
        <div class="field">
          <i class="fa-solid fa-key left"></i
          ><input
            id="n"
            type="password"
            name="new_password"
            oninput="strength(this.value)"
          /><i class="fa-solid fa-eye eye" onclick="tog('n', this)"></i>
        </div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <small id="txt">Password strength</small>
        <div class="tips">
          <b>Password Requirements</b><br />• 8+ characters &nbsp; • Uppercase
          &nbsp; • Number &nbsp; • Special character
        </div>
        <label>Confirm Password</label>
        <div class="field">
          <i class="fa-solid fa-shield-halved left"></i
          ><input id="p" type="password" name="confirm_password" /><i
            class="fa-solid fa-eye eye"
            onclick="tog('p', this)"
          ></i>
        </div>
        <div class="buttons">
          <button class="btn primary">Update Password</button
          ><a class="btn secondary" href="{% url 'profile' %}"
            >Back to Profile</a
          >
        </div>
      </form>
    </div>
    <script>
      function tog(id, i) {
        let e = document.getElementById(id);
        if (e.type === "password") {
          e.type = "text";
          i.className = "fa-solid fa-eye-slash eye";
        } else {
          e.type = "password";
          i.className = "fa-solid fa-eye eye";
        }
      }
      function strength(v) {
        let s = 0;
        if (v.length >= 8) s++;
        if (/[A-Z]/.test(v)) s++;
        if (/[0-9]/.test(v)) s++;
        if (/[^A-Za-z0-9]/.test(v)) s++;
        let w = [0, 25, 50, 75, 100][s],
          t = ["Password strength", "Weak", "Fair", "Good", "Strong"][s];
        fill.style.width = w + "%";
        txt.textContent = t;
      }
    </script>
  </body>
</html>
