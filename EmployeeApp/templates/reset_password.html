<!DOCTYPE html>
<html>
<head>

<title>Reset Password</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 15px;
    overflow-y:auto;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    position:relative;
}

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(35px);
    opacity:.35;
    z-index:-1;
}

body::before{
    width:320px;
    height:320px;
    background:#7c3aed;
    top:-120px;
    right:-80px;
}

body::after{
    width:260px;
    height:260px;
    background:#60a5fa;
    bottom:-80px;
    left:-80px;
}

.container{
    width:100%;
    max-width:420px;
    margin:30px 0;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(18px);
    border-radius:24px;
    padding:35px;
    box-shadow:0 25px 60px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#4338ca;
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
}

input{
    width:100%;
    height:52px;
    padding:0 16px;
    margin-bottom:20px;
    border:1px solid #dbe4f0;
    border-radius:14px;
    font-size:15px;
    transition:.3s;
}

input:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.15);
}

button{
    width:100%;
    height:54px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(79,70,229,.35);
}

.msg{
    margin-bottom:20px;
    padding:12px;
    border-radius:10px;
    background:#fee2e2;
    color:#dc2626;
    text-align:center;
    font-weight:600;
}

.success{
    margin-bottom:20px;
    padding:12px;
    border-radius:10px;
    background:#dcfce7;
    color:#15803d;
    text-align:center;
    font-weight:600;
}

.back-link{
    text-align:center;
    margin-top:20px;
}

.back-link a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:600;
}

.back-link a:hover{
    text-decoration:underline;
}
.field{
    position:relative;
    margin-bottom:18px;
}

.field input{
    width:100%;
    height:52px;
    padding:0 45px;
    margin-bottom:0;
    border:1px solid #dbe4f0;
    border-radius:14px;
    font-size:15px;
    transition:.3s;
}

.field input:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.15);
}

.left{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#6366f1;
    font-size:16px;
}

.eye{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
    cursor:pointer;
    transition:.3s;
}

.eye:hover{
    color:#4f46e5;
}

.bar{
    width:100%;
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 8px;
}

.fill{
    height:100%;
    width:0%;
    background:#ef4444;
    border-radius:20px;
    transition:.4s;
}

#txt{
    display:block;
    color:#64748b;
    font-size:13px;
    margin-bottom:15px;
}

.tips{
    background:#eef2ff;
    border-left:4px solid #6366f1;
    padding:12px 15px;
    border-radius:10px;
    color:#334155;
    font-size:14px;
    margin-bottom:25px;
    line-height:1.7;
}

@media(max-width:600px){

.container{
    padding:25px;
}

h2{
    font-size:24px;
}

}


</style>

</head>

<body>
    
<div class="container">

<h2>Reset Password</h2>

<p class="subtitle">
    Create a strong new password for your account.
</p>



<form method="POST">

    {% csrf_token %}

    <label>New Password</label>
        <div class="field">
          <i class="fa-solid fa-key left"></i
          ><input
            id="n"
            type="password"
            name="password"
            oninput="strength(this.value)"
          /><i class="fa-solid fa-eye eye" onclick="tog('n', this)"></i>
        </div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <small id="txt">Password strength</small>
        <div class="tips">
          <b>Password Requirements</b><br />• 8+ characters &nbsp; • Uppercase
          &nbsp; • Number &nbsp; • Special character
        </div>
        <label>Confirm Password</label>
        <div class="field">
          <i class="fa-solid fa-shield-halved left"></i
          ><input id="p" type="password" name="confirm_password" /><i
            class="fa-solid fa-eye eye"
            onclick="tog('p', this)"
          ></i>
        </div>

    <button type="submit">
        Reset Password
    </button>

</form>

<div class="back-link">
    <a href="{% url 'signin' %}">
        ← Back to Sign In
    </a>
</div>
</div>
<script>
function tog(id, icon){

    let input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
    else{
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }

}
</script>
<script>
function strength(password){

    let fill = document.getElementById("fill");
    let txt = document.getElementById("txt");

    let score = 0;

    if(password.length >= 8) score++;
    if(/[A-Z]/.test(password)) score++;
    if(/[0-9]/.test(password)) score++;
    if(/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;

    if(score == 0){
        fill.style.width="0%";
        fill.style.background="#ef4444";
        txt.innerHTML="Password strength";
    }
    else if(score == 1){
        fill.style.width="25%";
        fill.style.background="red";
        txt.innerHTML="Weak";
    }
    else if(score == 2){
        fill.style.width="50%";
        fill.style.background="orange";
        txt.innerHTML="Medium";
    }
    else if(score == 3){
        fill.style.width="75%";
        fill.style.background="#3b82f6";
        txt.innerHTML="Good";
    }
    else{
        fill.style.width="100%";
        fill.style.background="#16a34a";
        txt.innerHTML="Strong";
    }

}
</script>
</body>
</html>
