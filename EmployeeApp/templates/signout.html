<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Out</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
}

.container{
    width:400px;
    margin:80px auto;
    background:#ffd6ee;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
    text-align:left;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.btn{
    width:48%;
    padding:10px;
    border:none;
    border-radius:5px;
    background:black;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    background:#444;
}

</style>

</head>

<body>

<div class="container">

    <h2>Sign Out</h2>

    <form method="POST" action="{% url 'signout' %}">
        {% csrf_token %}

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email"
            required>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required>

        <div class="buttons">

            <button type="submit" class="btn">
                Sign Out
            </button>

            

        </div>

    </form>

</div>

</body>
</html>
