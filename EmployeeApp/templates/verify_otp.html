<!DOCTYPE html>
<html>
<head>

<title>Verify OTP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    position:relative;
    overflow:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(35px);
    opacity:.35;
    z-index:-1;
}

body::before{
    width:320px;
    height:320px;
    background:#7c3aed;
    top:-120px;
    right:-80px;
}

body::after{
    width:260px;
    height:260px;
    background:#60a5fa;
    bottom:-80px;
    left:-80px;
}

.container{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(18px);
    border-radius:24px;
    padding:35px;
    box-shadow:0 25px 60px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#4338ca;
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
    font-size:14px;
}

input{
    width:100%;
    height:55px;
    padding:0 18px;
    border:1px solid #dbe4f0;
    border-radius:14px;
    font-size:16px;
    text-align:center;
    letter-spacing:6px;
    transition:.3s;
}

input:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.15);
}

button{
    width:100%;
    height:54px;
    margin-top:25px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(79,70,229,.35);
}

.msg{
    margin-bottom:20px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:600;
    background:#fee2e2;
    color:#dc2626;
}

.back-link{
    text-align:center;
    margin-top:20px;
}

.back-link a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:600;
}

.back-link a:hover{
    text-decoration:underline;
}

@media(max-width:600px){

.container{
    padding:25px;
}

h2{
    font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

    <h2>Email Verification</h2>

    <p class="subtitle">
        Enter the 6-digit OTP sent to your email.
    </p>

    {% if message %}
        <div class="msg">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="otp"
            placeholder="Enter OTP"
            maxlength="6"
            required>

        <button type="submit">
            Verify OTP
        </button>
    </form>

    <div class="back-link">
        <a href="{% url 'signin' %}">← Back to Sign In</a>
    </div>

</div>

</body>
</html>
