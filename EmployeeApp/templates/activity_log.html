<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Logs · Pulse</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font (Inter) for modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f1f4fa;
            padding: 32px 24px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
        }

        /* ----- modern card / glassmorphism touches ----- */
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            border-radius: 24px;
            box-shadow: 0 20px 40px -12px rgba(79, 70, 229, 0.25),
                        0 8px 24px -8px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.2s ease;
        }

        /* ----- HEADER ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left i {
            font-size: 2rem;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1f2937, #374151);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            color: #1f2937;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid #e5e9f0;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            border: none;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.30);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.45);
            background: linear-gradient(135deg, #4338CA, #6D28D9);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #d1d8e7;
            color: #374151;
        }

        .btn-outline:hover {
            background: #f8faff;
            border-color: #7C3AED;
            color: #4F46E5;
        }

        /* ----- MESSAGE ----- */
        #message {
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 60px;
            background: #fee9e7;
            color: #b91c1c;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            max-width: 100%;
            border-left: 4px solid #b91c1c;
        }

        #message:empty {
            display: none;
        }

        /* ----- FILTERS (modern row) ----- */
        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 14px;
            padding: 20px 24px;
            background: white;
            border-radius: 80px;
            margin-bottom: 28px;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e9f0;
            border-radius: 60px;
            background: #f8faff;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
            font-family: 'Inter', sans-serif;
            color: #1f2937;
        }

        .filters input:focus,
        .filters select:focus {
            border-color: #7C3AED;
            background: white;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.10);
        }

        .filter-btn {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .filter-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
        }

        /* ----- TABLE (glass) ----- */
        .table-container {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 36px -12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 18px 16px;
            background: #f9fbff;
            color: #1f2937;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #eef2f8;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f0f3f9;
            color: #2d3748;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fbff;
        }

        .action-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.75rem;
            background: #eef2ff;
            color: #4F46E5;
            letter-spacing: 0.02em;
        }

        .action-badge.login { background: #dcfce7; color: #15803d; }
        .action-badge.logout { background: #fee2e2; color: #b91c1c; }
        .action-badge.registration { background: #dbeafe; color: #1d4ed8; }
        .action-badge.create { background: #e0f2fe; color: #0369a1; }
        .action-badge.update { background: #fef3c7; color: #b45309; }
        .action-badge.delete { background: #fce4ec; color: #b91c1c; }
        .action-badge.password_change { background: #ede9fe; color: #6d28d9; }

        .loading {
            text-align: center;
            padding: 48px 20px;
            color: #6b7280;
            font-weight: 500;
        }

        /* ----- PAGINATION ----- */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .pagination button {
            border: none;
            background: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            color: #1f2937;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid #e5e9f0;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .pagination button:hover:not(:disabled) {
            background: #f8fbff;
            border-color: #7C3AED;
            color: #4F46E5;
            transform: translateY(-1px);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #pageInfo {
            font-weight: 600;
            color: #1f2937;
            background: white;
            padding: 6px 20px;
            border-radius: 60px;
            border: 1px solid #eef2f8;
            font-size: 0.9rem;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 60px;
            background: white;
            border: 1px solid #e5e9f0;
            color: #1f2937;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .home-btn:hover {
            background: #f8fbff;
            border-color: #7C3AED;
            color: #4F46E5;
            transform: translateY(-1px);
        }

        /* ----- mobile ----- */
        @media (max-width: 820px) {
            body { padding: 20px 12px; }
            .filters {
                grid-template-columns: 1fr 1fr;
                border-radius: 28px;
                padding: 18px 16px;
                gap: 12px;
            }
            .filter-btn {
                grid-column: span 2;
                justify-content: center;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions { width: 100%; }
            .header-actions .btn { flex: 1; justify-content: center; }
            .pagination { gap: 12px; }
            .table-container { border-radius: 20px; }
        }

        @media (max-width: 500px) {
            .filters { grid-template-columns: 1fr; }
            .filter-btn { grid-column: 1; }
        }

        /* subtle gradient decoration */
        .bg-glow {
            position: fixed;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
        .bg-glow-2 {
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79,70,229,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-left">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <h1>Activity Logs</h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="exportCSV()">
                <i class="fa-solid fa-file-csv"></i> Export CSV
            </button>
        </div>
    </div>

    <!-- ===== MESSAGE ===== -->
    <div id="message"><i class="fa-regular fa-circle-exclamation"></i> <span id="msgText"></span></div>

    <!-- ===== FILTERS ===== -->
    <div class="filters card">
        <input type="text" id="search" placeholder="Search username, role, action, description..." />
        <select id="action">
            <option value="">All Actions</option>
            <option value="LOGIN">Login</option>
            <option value="LOGOUT">Logout</option>
            <option value="REGISTRATION">Registration</option>
            <option value="CREATE">Create</option>
            <option value="UPDATE">Update</option>
            <option value="DELETE">Delete</option>
            <option value="PASSWORD_CHANGE">Password Change</option>
        </select>
        <select id="role">
            <option value="">All Roles</option>
            <option value="Admin">Admin</option>
            <option value="User">User</option>
        </select>
        <button class="filter-btn" onclick="loadLogs(1)">
            <i class="fa-solid fa-filter"></i> Apply Filter
        </button>
    </div>

    <!-- ===== TABLE ===== -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Action</th>
                    <th>Description</th>
                    <th>IP Address</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="logsTable">
                <tr><td colspan="7" class="loading"><i class="fa-solid fa-spinner fa-pulse"></i> Loading activity logs...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ===== PAGINATION ===== -->
    <div class="pagination">
        <button id="previousBtn" onclick="previousPage()">
            <i class="fa-solid fa-angle-left"></i> Previous
        </button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextBtn" onclick="nextPage()">
            Next <i class="fa-solid fa-angle-right"></i>
        </button>
        <a href="{% url 'dashboard' %}" class="home-btn" >
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

</div>

<script>
    /* ============================================================
    GLOBALS
    ============================================================ */
    let currentPage = 1;
    let totalPages = 1;

    /* ============================================================
    GET FILTERS
    ============================================================ */
    function getFilters() {
        const search = document.getElementById('search').value.trim();
        const action = document.getElementById('action').value;
        const role = document.getElementById('role').value;
        return { search, action, role };
    }

    /* ============================================================
    LOAD LOGS
    ============================================================ */
    async function loadLogs(page = 1) {
        currentPage = page;
        const filters = getFilters();
        const params = new URLSearchParams();
        params.append('page', page);
        params.append('page_size', 8);
        if (filters.search) params.append('search', filters.search);
        if (filters.action) params.append('action', filters.action);
        if (filters.role) params.append('role', filters.role);

        const msgEl = document.getElementById('message');
        const msgText = document.getElementById('msgText');
        msgEl.style.display = 'none';

        try {
            const response = await fetch(`/api/activity-logs/?${params.toString()}`, {
                method: 'GET',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' }
            });

            const result = await response.json();

            if (!response.ok) {
                msgText.innerText = result.message || 'Unable to load activity logs.';
                msgEl.style.display = 'flex';
                return;
            }

            const table = document.getElementById('logsTable');
            table.innerHTML = '';

            if (!result.data || result.data.length === 0) {
                table.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:32px; color:#6b7280;">
                    <i class="fa-regular fa-file-lines"></i> No activity logs found.
                </td></tr>`;
            } else {
                result.data.forEach(log => {
                    const row = document.createElement('tr');
                    const actionClass = (log.action || '').toLowerCase().replace('_', '-');
                    row.innerHTML = `
                        <td>${log.id}</td>
                        <td>${escapeHTML(log.username || '-')}</td>
                        <td>${escapeHTML(log.role || '-')}</td>
                        <td><span class="action-badge ${actionClass}">${escapeHTML(log.action || '-')}</span></td>
                        <td>${escapeHTML(log.description || '-')}</td>
                        <td>${escapeHTML(log.ip_address || '-')}</td>
                        <td>${formatDate(log.timestamp)}</td>
                    `;
                    table.appendChild(row);
                });
            }

            totalPages = result.pagination?.total_pages || 1;
            currentPage = result.pagination?.current_page || 1;
            document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('previousBtn').disabled = !result.pagination?.has_previous;
            document.getElementById('nextBtn').disabled = !result.pagination?.has_next;

        } catch (error) {
            console.error('Activity Log Error:', error);
            msgText.innerText = 'Server error while loading activity logs.';
            msgEl.style.display = 'flex';
        }
    }

    /* ============================================================
    PAGINATION
    ============================================================ */
    function previousPage() { if (currentPage > 1) loadLogs(currentPage - 1); }
    function nextPage() { if (currentPage < totalPages) loadLogs(currentPage + 1); }

    /* ============================================================
    EXPORT CSV
    ============================================================ */
    async function exportCSV() {
        const filters = getFilters();
        const params = new URLSearchParams();
        if (filters.search) params.append('search', filters.search);
        if (filters.action) params.append('action', filters.action);
        if (filters.role) params.append('role', filters.role);

        const msgEl = document.getElementById('message');
        const msgText = document.getElementById('msgText');
        msgEl.style.display = 'none';

        try {
            const response = await fetch(`/api/activity-logs/export/?${params.toString()}`, {
                method: 'GET',
                credentials: 'same-origin'
            });

            if (!response.ok) {
                let result = {};
                try { result = await response.json(); } catch (_) {}
                msgText.innerText = result.message || 'Unable to export activity logs.';
                msgEl.style.display = 'flex';
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'activity_logs.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

        } catch (error) {
            console.error('CSV Export Error:', error);
            msgText.innerText = 'Server error while exporting activity logs.';
            msgEl.style.display = 'flex';
        }
    }

    /* ============================================================
    HELPERS
    ============================================================ */
    function escapeHTML(value) {
        if (!value) return '';
        const div = document.createElement('div');
        div.textContent = value;
        return div.innerHTML;
    }

    function formatDate(timestamp) {
        if (!timestamp) return '-';
        const date = new Date(timestamp);
        if (isNaN(date.getTime())) return timestamp;
        return date.toLocaleString('en-US', { 
            month: 'short', day: 'numeric', year: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }

    /* ============================================================
    INIT
    ============================================================ */
    loadLogs(1);
</script>

</body>
</html>
