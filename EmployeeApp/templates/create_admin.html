<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Admin</title>

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
        body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 15px;
    overflow-y:auto;
    overflow-x:hidden;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
}
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(25px);
        opacity: 0.35;
        z-index: -1;
      }

      body::before {
        width: 320px;
        height: 320px;
        background: #7c3aed;
        top: -120px;
        right: -80px;
      }

      body::after {
        width: 260px;
        height: 260px;
        background: #60a5fa;
        bottom: -90px;
        left: -80px;
      }
    .container{
    width:100%;
    max-width:520px;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}
      .title {
        text-align: center;

        margin-bottom: 30px;
      }

      .title h2 {
        font-size: 30px;

        color: #4f46e5;

        margin-bottom: 10px;
      }

      .title p {
        color: #64748b;

        font-size: 15px;
      }

      .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #334155;

        font-weight: 600;
      }

      .left-icon{
    left:15px;
}

.eye{
    left:auto;
    right:15px;
    cursor:pointer;
}
      .toggle-password {
        position: absolute;

        right: 15px;

        top: 50%;

        transform: translateY(-50%);

        color: #64748b;

        cursor: pointer;
      }

    .input-box{
    position:relative;
    width:90%;
}
    .input-box input{
    width:100%;
    height:50px;
    padding:0 15px 0 45px;
    border:1px solid #d6d6d6;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.input-box i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#667eea;
    font-size:16px;
}

      .input-box input:focus {
        outline: none;

        border-color: #6366f1;

        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }
      select {
        width: 100%;

        height: 54px;

        border: 1px solid #dce3f1;

        border-radius: 14px;

        padding: 0 15px;

        margin-bottom: 18px;

        font-size: 15px;

        outline: none;
      }

      select:focus {
        border-color: #6366f1;

        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }
      .btn {
        width: 100%;

        height: 54px;

        border: none;

        border-radius: 14px;

        background: linear-gradient(135deg, #4f46e5, #7c3aed);

        color: white;

        font-size: 17px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.3s;
      }

      .btn:hover {
        transform: translateY(-2px);

        box-shadow: 0 12px 25px rgba(79, 70, 229, 0.35);
      }
      .login-link {
        margin-top: 25px;

        text-align: center;

        color: #64748b;
      }

      .login-link a {
        color: #4f46e5;

        text-decoration: none;

        font-weight: 600;
      }

      @media (max-width: 600px) {
        .container {
          width: 95%;

          padding: 25px;
        }

        .title h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">
        <h2>
          <i class="fa-solid fa-user-shield"></i>
          Create Admin
        </h2>

        <p>Register new administrator account</p>
      </div>

      <!-- Django Messages -->

      {% comment %} {% if messages %}

      <div class="message">
        {% for message in messages %}

        <p class="{{message.tags}}">{{message}}</p>

        {% endfor %}
      </div>

      {% endif %} {% endcomment %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label>Admin Name</label>

          <div class="input-box">
            <i class="fa-solid fa-user"></i>

            <input
              type="text"
              name="name"
              placeholder="Enter admin name"
              required
            />
          </div>
        </div>
        <label>Select Gender</label>
        <select name="gender">
          <option
            value="Male"
            {%
            if
            employee.gender=""
            ="Male"
            %}selected{%
            endif
            %}
          >
            Male
          </option>

          <option
            value="Female"
            {%
            if
            employee.gender=""
            ="Female"
            %}selected{%
            endif
            %}
          >
            Female
          </option>

          <option
            value="Other"
            {%
            if
            employee.gender=""
            ="Other"
            %}selected{%
            endif
            %}
          >
            Other
          </option>
        </select>

        <div class="form-group">
          <label>Age</label>

          <div class="input-box">
            <i class="fa-solid fa-calendar"></i>

            <input
              type="number"
              name="age"
              placeholder="Enter age"
              min="18"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>

          <div class="input-box">
            <i class="fa-solid fa-envelope"></i>

            <input
              type="email"
              name="email"
              placeholder="Enter email address"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>

          <div class="input-box">
            <i class="fa-solid fa-phone"></i>

            <input
              type="text"
              name="mobile"
              placeholder="Enter mobile number"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Department</label>

          <div class="input-box">
            <i class="fa-solid fa-building"></i>

            <input
              type="text"
              name="department"
              placeholder="Enter department"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>City</label>

          <div class="input-box">
            <i class="fa-solid fa-location-dot"></i>

            <input type="text" name="city" placeholder="Enter city" required />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>

          <div class="input-box">

    <i class="fa-solid fa-lock left-icon"></i>

    <input
        id="password"
        type="password"
        name="password"
        placeholder="Create password"
    >

    <i class="fa-solid fa-eye eye"
       onclick="togglePassword('password',this)"></i>

</div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>

          <div class="input-box">
            <i class="fa-solid fa-key"></i>

            <input
              type="password"
              name="confirm_password"
              placeholder="Confirm password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn">
          <i class="fa-solid fa-user-plus"></i>
          Create Admin
        </button>
      </form>

      <div class="login-link">
        Already have an account?

        <a href="{% url 'signin' %}"> Login </a>
      </div>
    </div>
    <script>
      function togglePassword(id, icon) {
        const input = document.getElementById(id);

        if (input.type === "password") {
          input.type = "text";

          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          input.type = "password";

          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }
    </script>
  </body>
</html>
