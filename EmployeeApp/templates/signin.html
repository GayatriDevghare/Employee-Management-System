<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>
       *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-y:auto;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    position:relative;
}

/* Background Effects */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(35px);
    opacity:.35;
    z-index:-1;
}

body::before{
    width:320px;
    height:320px;
    background:#7c3aed;
    top:-120px;
    right:-80px;
}

body::after{
    width:260px;
    height:260px;
    background:#60a5fa;
    bottom:-80px;
    left:-80px;
}

/* Login Card */

.container{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(18px);
    padding:35px;
    border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.15);
}

/* Heading */

h2{
    text-align:center;
    color:#4338ca;
    font-size:30px;
    margin-bottom:30px;
}

/* Labels */

label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
}

/* Input Box */

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#6366f1;
    font-size:17px;
}

.input-box input{
    width:100%;
    height:52px;
    border:1px solid #dbe4f0;
    border-radius:14px;
    padding:0 15px 0 45px;
    font-size:15px;
    transition:.3s;
    background:#fff;
}

.input-box input:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.15);
}

/* Button */

.btn{
    width:100%;
    height:52px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(79,70,229,.35);
}

/* Links */

.forgot-link,
.signup-link{
    text-align:center;
    margin-top:18px;
}

.forgot-link a,
.signup-link a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:600;
}

.forgot-link a:hover,
.signup-link a:hover{
    text-decoration:underline;
}

/* Messages */

.message{
    margin-top:18px;
    text-align:center;
    padding:12px;
    border-radius:10px;
    font-weight:600;
}

.success{
    background:#dcfce7;
    color:#15803d;
}

.error{
    background:#fee2e2;
    color:#dc2626;
}

/* Mobile */

@media(max-width:480px){

    .container{
        padding:25px;
    }

    h2{
        font-size:24px;
    }

}
</style>
<body>

<div class="container">

    <h2>Sign In</h2>

    <form method="POST" action="{% url 'signin' %}">

        {% csrf_token %}

        <!-- Email -->
        <div class="form-group">

            <label>Email</label>

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

        </div>

        <!-- Password -->
        <div class="form-group">

            <label>Password</label>

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>

        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn">
            <i class="fas fa-sign-in-alt"></i>
            Sign In
        </button>

    </form>

    <!-- Forgot Password -->
    <div class="forgot-link">
        <a href="{% url 'forgot_password' %}">
            Forgot Password?
        </a>
    </div>

    <!-- Django Message -->
    {% if message %}
        <div class="message" style="color: {{ color }};">
            {{ message }}
        </div>
    {% endif %}

    <!-- Register Link -->
    <div class="signup-link">

        Don't have an account?

        <a href="{% url 'signup' %}">
            Register
        </a>

    </div>

</div>

</body>
</html>
