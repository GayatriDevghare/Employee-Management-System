<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/questions.css' %}">

   <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f5f5f5;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        width:420px;
        background:#ffffff;
        padding:35px;
        border-radius:12px;
        box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    h2{
        text-align:center;
        margin-bottom:25px;
        color:#333;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#444;
    }

    input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:15px;
        margin-bottom:20px;
        outline:none;
        transition:0.3s;
    }

    input:focus{
        border-color:#007bff;
        box-shadow:0 0 5px rgba(0,123,255,0.3);
    }

    .btn{
        width:100%;
        padding:12px;
        background:#dc3545;
        color:#fff;
        border:none;
        border-radius:6px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    .btn:hover{
        background:#b02a37;
    }

    .msg{
        margin-top:20px;
        padding:12px;
        border-radius:6px;
        background:#d4edda;
        color:#155724;
        text-align:center;
        font-weight:bold;
    }

    .error{
        background:#f8d7da;
        color:#721c24;
    }
</style>

</head>
<body>

<div class="container">

    <h2>Delete Employee</h2>

    <form action="{% url 'delete_employee' %}" method="POST">
        {% csrf_token %}

        <label for="email">Employee Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Employee Email"
            required>

        <button type="submit" class="btn">
            Delete Employee
        </button>
    </form>

    {% if msg %}
        <div class="msg">
            {{ msg }}
        </div>
    {% endif %}

    {% if error %}
        <div class="msg error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
